<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng dẫn tạo Fixed Menu</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* 1. Cố định thanh Menu ở mép trên cùng */
        .navbar {
            overflow: hidden;
            background-color: #333;
            position: fixed; /* Giữ vị trí cố định khi cuộn */
            top: 0;          /* Đặt ở mép trên cùng */
            width: 100%;     /* Phủ kín chiều rộng màn hình */
            z-index: 1000;   /* Đảm bảo menu luôn nằm nổi phía trên các nội dung khác */
        }

        /* Định dạng các đường link trong menu */
        .navbar a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        /* 2. Vùng nội dung chính */
        .main {
            padding: 16px;
            margin-top: 50px; /* Đẩy nội dung xuống dưới để không bị menu đè lên */
            height: 1500px;  /* Tạo chiều cao lớn để hiển thị thanh cuộn */
        }
    </style>
</head>
<body>

    <!-- Thanh Navigation Bar Cố Định -->
    <div class="navbar">
        <a href="#home">Home</a>
        <a href="#news">News</a>
        <a href="#contact">Contact</a>
        <a href="#about">About</a>
    </div>

    <!-- Nội dung trang web -->
    <div class="main">
        <h1>Fixed Top Menu</h1>
        <h2>Scroll this page to see the effect</h2>
        <h2>The navigation bar will stay at the top of the page while scrolling</h2>
        <p>Some text some text some text some text...</p>
        <p>Some text some text some text some text...</p>
    </div>

</body>
</html>
